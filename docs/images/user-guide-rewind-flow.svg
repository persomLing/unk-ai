<svg xmlns="http://www.w3.org/2000/svg" width="870" height="654" viewBox="0 0 870 654" role="img" aria-labelledby="title desc">
<title id="title">回退编辑和复制，分别会发生什么？</title><desc id="desc">回退编辑会截断后续分支并恢复附件；复制仅复制文字。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#20685d"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="870" height="654" rx="20" fill="#f6f8f5"/>
<text x="30" y="47" font-size="28" fill="#243e33" font-weight="700" text-anchor="start"><tspan x="30" dy="0">回退编辑和复制，分别会发生什么？</tspan></text><text x="30" y="82" font-size="17" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="30" dy="0">回退编辑会截断后续分支并恢复附件；复制仅复制文字。</tspan></text><rect x="35" y="115" width="330" height="222" rx="14" fill="#fff" stroke="#cfded5"/><text x="57" y="150" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="57" dy="0">回退前：原对话分支</tspan></text><text x="57" y="186" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="57" dy="0">第 1 问 + 回答</tspan><tspan x="57" dy="28">第 2 问（带图片）+ 回答</tspan><tspan x="57" dy="28">第 3 问 + 回答</tspan><tspan x="57" dy="28"></tspan><tspan x="57" dy="28">先停止正在运行的工作</tspan></text><rect x="435" y="115" width="400" height="222" rx="14" fill="#eef5ef" stroke="#cfded5"/><text x="457" y="150" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="457" dy="0">在第 2 问上点回退编辑</tspan></text><text x="457" y="186" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="457" dy="0">悬停原提问，找到回退图标</tspan><tspan x="457" dy="28">第 2 问及后续消息被移除</tspan><tspan x="457" dy="28">第 1 问与回答继续保留</tspan><tspan x="457" dy="28"></tspan><tspan x="457" dy="28">需要保留后续分支时先导出</tspan></text><path d="M 365 224 L 429 224" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 635 337 L 635 366" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="435" y="375" width="400" height="145" rx="14" fill="#fff" stroke="#cfded5"/><text x="457" y="410" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="457" dy="0">输入框恢复原提问</tspan></text><text x="457" y="446" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="457" dy="0">文字、图片、文档与选区一起回来</tspan><tspan x="457" dy="28">核对页面来源和页面操作模式</tspan><tspan x="457" dy="28">修改后再次发送，生成新的分支</tspan></text><rect x="35" y="375" width="330" height="145" rx="14" fill="#fff6e8" stroke="#cfded5"/><text x="57" y="410" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="57" dy="0">输入框里的仍是草稿</tspan></text><text x="57" y="446" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="57" dy="0">回退不等于保存新草稿</tspan><tspan x="57" dy="28">关闭侧栏前先重新发送</tspan><tspan x="57" dy="28">图片不可恢复时重新添加</tspan></text><rect x="35" y="554" width="800" height="70" rx="12" fill="#eef5ef"/><text x="435" y="596" font-size="20" fill="#20685d" font-weight="650" text-anchor="middle"><tspan x="435" dy="0">只想取走原问题文字？点复制，原对话分支保持不变。</tspan></text></g></svg>
