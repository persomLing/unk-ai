<svg xmlns="http://www.w3.org/2000/svg" width="870" height="754" viewBox="0 0 870 754" role="img" aria-labelledby="title desc">
<title id="title">提问图片保存在哪里？</title><desc id="desc">本地会话与图片在同一数据目录下；原上传文件不会被插件移动。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#20685d"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="870" height="754" rx="20" fill="#f6f8f5"/>
<text x="30" y="47" font-size="28" fill="#243e33" font-weight="700" text-anchor="start"><tspan x="30" dy="0">提问图片保存在哪里？</tspan></text><text x="30" y="82" font-size="17" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="30" dy="0">本地会话与图片在同一数据目录下；原上传文件不会被插件移动。</tspan></text><rect x="35" y="119" width="250" height="116" rx="14" fill="#fff" stroke="#cfded5"/><circle cx="60" cy="147" r="13" fill="#20685d"/><text x="60" y="153" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="60" dy="0">1</tspan></text><text x="84" y="154" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="84" dy="0">添加提问图片</tspan></text><text x="57" y="190" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="57" dy="0">上传、粘贴或拖入输入框</tspan><tspan x="57" dy="28">较大图片可能被压缩</tspan></text><path d="M 285 177 L 315 177" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="315" y="119" width="250" height="116" rx="14" fill="#fff" stroke="#cfded5"/><circle cx="340" cy="147" r="13" fill="#20685d"/><text x="340" y="153" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="340" dy="0">2</tspan></text><text x="364" y="154" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="364" dy="0">发送并保存会话</tspan></text><text x="337" y="190" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="337" dy="0">草稿不是已保存的对话</tspan><tspan x="337" dy="28">先选择并授权数据目录</tspan></text><path d="M 565 177 L 595 177" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="595" y="119" width="240" height="116" rx="14" fill="#fff" stroke="#cfded5"/><circle cx="620" cy="147" r="13" fill="#20685d"/><text x="620" y="153" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="620" dy="0">3</tspan></text><text x="644" y="154" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="644" dy="0">看清保存状态</tspan></text><text x="617" y="190" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="617" dy="0">“待同步”还没确认写盘</tspan><tspan x="617" dy="28">恢复原目录权限再同步</tspan></text><rect x="35" y="278" width="250" height="200" rx="14" fill="#fff6e8" stroke="#cfded5"/><text x="57" y="313" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="57" dy="0">浏览器中的记录</tspan></text><text x="57" y="349" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="57" dy="0">临时对话和待写图片</tspan><tspan x="57" dy="28">用于等待保存或重试同步</tspan><tspan x="57" dy="28"></tspan><tspan x="57" dy="28">清理浏览器数据前</tspan><tspan x="57" dy="28">先处理待同步内容</tspan></text><path d="M 285 368 L 317 368" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="322" y="278" width="513" height="270" rx="16" fill="#fff" stroke="#cfded5"/><text x="345" y="315" font-size="22" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="345" dy="0">你选择的本地数据目录</tspan></text><rect x="344" y="337" width="468" height="87" rx="14" fill="#eef5ef" stroke="#cfded5"/><text x="366" y="372" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="366" dy="0">conversations/ · 会话记录</tspan></text><text x="366" y="408" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="366" dy="0">问题、回答以及对应的图片路径</tspan></text><rect x="344" y="438" width="468" height="87" rx="14" fill="#eef5ef" stroke="#cfded5"/><text x="366" y="473" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="366" dy="0">images/ · 提问图片文件</tspan></text><text x="366" y="509" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="366" dy="0">会话打开时从这里读取图片内容</tspan></text><path d="M 580 548 L 580 575" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="322" y="580" width="513" height="143" rx="14" fill="#fff6e8" stroke="#cfded5"/><text x="344" y="615" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="344" dy="0">备份时两份目录一起保留</tspan></text><text x="344" y="651" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="344" dy="0">只复制 JSON 或导出 Markdown 不能带走图片</tspan><tspan x="344" dy="28">分组、模型配置和临时记录还在当前浏览器</tspan><tspan x="344" dy="28">保留原上传文件，避免只剩压缩后的副本</tspan></text><text x="35" y="514" font-size="18" fill="#865e2c" font-weight="500" text-anchor="start"><tspan x="35" dy="0">文件缺失或权限失效？</tspan><tspan x="35" dy="28">先恢复原目录中的图片，</tspan><tspan x="35" dy="28">也可以重新添加原图片。</tspan></text></g></svg>
