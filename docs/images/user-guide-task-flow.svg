<svg xmlns="http://www.w3.org/2000/svg" width="870" height="686" viewBox="0 0 870 686" role="img" aria-labelledby="title desc">
<title id="title">这次该用哪种模式？</title><desc id="desc">按任务选择入口：聊天、网页阅读、网页操作各有对应范围。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#20685d"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="870" height="686" rx="20" fill="#f6f8f5"/>
<text x="30" y="47" font-size="28" fill="#243e33" font-weight="700" text-anchor="start"><tspan x="30" dy="0">这次该用哪种模式？</tspan></text><text x="30" y="82" font-size="17" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="30" dy="0">按任务选择入口：聊天、网页阅读、网页操作各有对应范围。</tspan></text><rect x="240" y="113" width="390" height="98" rx="14" fill="#eef5ef" stroke="#cfded5"/><text x="435" y="148" font-size="21" fill="#243e33" font-weight="650" text-anchor="middle"><tspan x="435" dy="0">先选本轮任务</tspan></text><text x="435" y="184" font-size="18" fill="#64776e" font-weight="400" text-anchor="middle"><tspan x="435" dy="0">先核对网页开关，再决定是否进入页面操作</tspan></text><path d="M435 211 V233 M160 233 H710 M160 233 V260 M435 233 V260 M710 233 V260" fill="none" stroke="#20685d" stroke-width="2.5"/><rect x="35" y="260" width="250" height="150" rx="14" fill="#fff" stroke="#cfded5"/><circle cx="60" cy="288" r="13" fill="#20685d"/><text x="60" y="294" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="60" dy="0">1</tspan></text><text x="84" y="295" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="84" dy="0">直接聊天 / 附件解释</tspan></text><text x="57" y="331" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="57" dy="0">不依赖当前网页时</tspan><tspan x="57" dy="28">关闭“基于当前页”</tspan><tspan x="57" dy="28">需要图片时选视觉模型</tspan></text><rect x="310" y="260" width="250" height="150" rx="14" fill="#fff" stroke="#cfded5"/><circle cx="335" cy="288" r="13" fill="#20685d"/><text x="335" y="294" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="335" dy="0">2</tspan></text><text x="359" y="295" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="359" dy="0">阅读当前网页</tspan></text><text x="332" y="331" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="332" dy="0">开启“基于当前页”</tspan><tspan x="332" dy="28">日常问题保持“自动”</tspan><tspan x="332" dy="28">资料不足时再选“深入”</tspan></text><rect x="585" y="260" width="250" height="150" rx="14" fill="#fff" stroke="#cfded5"/><circle cx="610" cy="288" r="13" fill="#20685d"/><text x="610" y="294" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="610" dy="0">3</tspan></text><text x="634" y="295" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="634" dy="0">让插件操作网页</tspan></text><text x="607" y="331" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="607" dy="0">开启浏览器控制</tspan><tspan x="607" dy="28">开启当前页与“页面操作”</tspan><tspan x="607" dy="28">确认站点和具体动作</tspan></text><path d="M 160 410 L 160 440" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 435 410 L 435 440" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 710 410 L 710 440" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="440" width="250" height="126" rx="14" fill="#fff" stroke="#cfded5"/><text x="160" y="475" font-size="21" fill="#243e33" font-weight="650" text-anchor="middle"><tspan x="160" dy="0">发送文字或附件</tspan></text><text x="160" y="511" font-size="18" fill="#64776e" font-weight="400" text-anchor="middle"><tspan x="160" dy="0">直接解释你提供的内容</tspan><tspan x="160" dy="28">明确要联网时仍会检索</tspan></text><rect x="310" y="440" width="250" height="126" rx="14" fill="#fff" stroke="#cfded5"/><text x="435" y="475" font-size="21" fill="#243e33" font-weight="650" text-anchor="middle"><tspan x="435" dy="0">查看回答与来源</tspan></text><text x="435" y="511" font-size="18" fill="#64776e" font-weight="400" text-anchor="middle"><tspan x="435" dy="0">检查实际读过的页面</tspan><tspan x="435" dy="28">来源不足按提示补充</tspan></text><rect x="585" y="440" width="250" height="126" rx="14" fill="#fff" stroke="#cfded5"/><text x="710" y="475" font-size="21" fill="#243e33" font-weight="650" text-anchor="middle"><tspan x="710" dy="0">核对页面实际结果</tspan></text><text x="710" y="511" font-size="18" fill="#64776e" font-weight="400" text-anchor="middle"><tspan x="710" dy="0">超时或结果不明先接管</tspan><tspan x="710" dy="28">停止不能撤销已执行动作</tspan></text><rect x="35" y="594" width="800" height="63" rx="12" fill="#eef5ef"/><text x="435" y="633" font-size="20" fill="#20685d" font-weight="650" text-anchor="middle"><tspan x="435" dy="0">三种任务共用发送入口，发送前检查当前模式</tspan></text></g></svg>
