<svg xmlns="http://www.w3.org/2000/svg" width="870" height="819" viewBox="0 0 870 819" role="img" aria-labelledby="title desc">
<title id="title">回复很慢或网页操作失败，怎么排查？</title><desc id="desc">先看阶段与网页实际状态，再停止或导出日志；结果不明时不要重复提交。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#20685d"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="870" height="819" rx="20" fill="#f6f8f5"/>
<text x="30" y="47" font-size="28" fill="#243e33" font-weight="700" text-anchor="start"><tspan x="30" dy="0">回复很慢或网页操作失败，怎么排查？</tspan></text><text x="30" y="82" font-size="17" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="30" dy="0">先看阶段与网页实际状态，再停止或导出日志；结果不明时不要重复提交。</tspan></text><rect x="35" y="115" width="800" height="138" rx="14" fill="#eef5ef" stroke="#cfded5"/><text x="57" y="150" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="57" dy="0">先看当前等待阶段</tspan></text><text x="57" y="186" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="57" dy="0">主模型分析 → 按需搜索或读取来源 → 继续分析或回答</tspan><tspan x="57" dy="28">等待模型输出超过 15 秒仍无内容，会提示尚未收到正文或思考。</tspan><tspan x="57" dy="28">这能说明等待在哪里，不能证明服务商正在思考或排队。</tspan></text><path d="M 435 253 L 435 278" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="285" width="380" height="150" rx="14" fill="#fff" stroke="#cfded5"/><circle cx="60" cy="313" r="13" fill="#20685d"/><text x="60" y="319" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="60" dy="0">1</tspan></text><text x="84" y="320" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="84" dy="0">可以继续等待</tspan></text><text x="57" y="356" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="57" dy="0">检查服务和所选模型是否可用</tspan><tspan x="57" dy="28">已有内容先复制或保留</tspan><tspan x="57" dy="28">不要连续点击重新生成</tspan></text><rect x="445" y="285" width="390" height="150" rx="14" fill="#fff" stroke="#cfded5"/><circle cx="470" cy="313" r="13" fill="#20685d"/><text x="470" y="319" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="470" dy="0">2</tspan></text><text x="494" y="320" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="494" dy="0">需要结束当前工作</tspan></text><text x="467" y="356" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="467" dy="0">点击停止，保留已收到内容</tspan><tspan x="467" dy="28">网页动作先核对是否已经生效</tspan><tspan x="467" dy="28">结果不明的提交不要直接重做</tspan></text><path d="M225 435 V447 H640 V435 M435 447 V475" fill="none" stroke="#20685d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="484" width="800" height="90" rx="14" fill="#eef5ef" stroke="#cfded5"/><text x="57" y="519" font-size="21" fill="#243e33" font-weight="650" text-anchor="start"><tspan x="57" dy="0">仍有问题：导出对应范围的诊断日志</tspan></text><text x="57" y="555" font-size="18" fill="#64776e" font-weight="400" text-anchor="start"><tspan x="57" dy="0">当前对话和全部对话是两个入口，日期都按北京时间计算。</tspan></text><rect x="35" y="597" width="380" height="150" rx="14" fill="#fff" stroke="#cfded5"/><text x="225" y="632" font-size="21" fill="#243e33" font-weight="650" text-anchor="middle"><tspan x="225" dy="0">只排查当前对话</tspan></text><text x="225" y="668" font-size="18" fill="#64776e" font-weight="400" text-anchor="middle"><tspan x="225" dy="0">顶部下载菜单 → 诊断日志</tspan><tspan x="225" dy="28">也可点错误卡片的导出按钮</tspan><tspan x="225" dy="28">导出本对话今天的记录</tspan></text><rect x="445" y="597" width="390" height="150" rx="14" fill="#fff" stroke="#cfded5"/><text x="640" y="632" font-size="21" fill="#243e33" font-weight="650" text-anchor="middle"><tspan x="640" dy="0">需要全部对话的记录</tspan></text><text x="640" y="668" font-size="18" fill="#64776e" font-weight="400" text-anchor="middle"><tspan x="640" dy="0">历史区底部“设置”</tspan><tspan x="640" dy="28">本地数据 → 诊断日志</tspan><tspan x="640" dy="28">导出全部对话今天的记录</tspan></text><text x="435" y="790" font-size="17" fill="#64776e" font-weight="400" text-anchor="middle"><tspan x="435" dy="0">日志不含对话正文、附件、输入值或密钥；分享时另写现象和发生时间。</tspan></text></g></svg>
