<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>图片文件存储浏览器回归</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;line-height:1.7;background:#f7f8fa;color:#202938}main{padding:28px;background:white;border:1px solid #ddd;border-radius:12px}img{width:140px;height:140px;image-rendering:pixelated}pre{white-space:pre-wrap;background:#f3f4f6;padding:16px}button{padding:10px 16px}</style>
<main><h1>图片文件存储浏览器回归</h1><p>隔离浏览器的 OPFS 目录、真实 IndexedDB 与 Web Locks；不访问用户数据目录。</p><button id="run">运行本地回归</button><p id="state">待运行</p><img id="preview" alt="保存后读回的参考图" hidden><pre id="report"></pre></main>
<script type="module">
import { saveLocalConversation, loadConversation, trashSavedConversations, restoreTrashedConversations } from '/src/utils/conversation-store.js';
import { readConversationRecord } from '/src/utils/local-directory.js';
const PNG='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+j5xkAAAAASUVORK5CYII=';
const check=(value,message)=>{if(!value)throw new Error(message);};
document.querySelector('#run').onclick=async()=>{
  try{
    const memory=new Map();
    globalThis.chrome={storage:{local:{get:async key=>({[key]:memory.get(key)}),set:async values=>{for(const[key,value]of Object.entries(values))memory.set(key,structuredClone(value));},remove:async key=>memory.delete(key)}}};
    const root=await navigator.storage.getDirectory();
    const folder=await root.getDirectoryHandle(`image-test-${crypto.randomUUID()}`,{create:true});
    globalThis.__unkAiDirectoryHandle=folder;
    const id=`browser-images-${crypto.randomUUID()}`;
    const original={version:2,id,storage:'local',title:'浏览器图片回归',messages:[{id:'u1',role:'user',content:'测试',attachments:[{id:'img',type:'image',name:'参考.png',mime:'image/png',dataUrl:PNG}]}]};
    const saved=await saveLocalConversation(original,{timeoutMs:5000});
    check(saved.syncStatus==='synced',`save failed: ${saved.syncError}`);
    const disk=await readConversationRecord(id,{directoryHandle:folder});
    const attachment=disk.messages[0].attachments[0];
    check(!attachment.dataUrl&&!JSON.stringify(disk).includes('base64'),'JSON retained Base64');
    const pixels=await (await (await folder.getDirectoryHandle('images')).getFileHandle(attachment.imagePath.split('/')[1])).getFile();
    check(pixels.size===atob(PNG.split(',')[1]).length,'binary file size mismatch');
    check(original.messages[0].attachments[0].dataUrl===PNG,'live pixels mutated');
    const loaded=await loadConversation(id);
    check(loaded.messages[0].attachments[0].dataUrl===PNG,'pixels did not hydrate');
    const img=document.querySelector('#preview');img.hidden=false;img.src=loaded.messages[0].attachments[0].dataUrl;await img.decode();
    const deletion=await trashSavedConversations([id]);
    check(deletion.deletedIds.includes(id),'trash failed');
    const restored=await restoreTrashedConversations(deletion.token);
    check(restored.restoredIds.includes(id),'undo failed');
    check((await loadConversation(id)).messages[0].attachments[0].dataUrl===PNG,'undo lost original pixels');
    await (await folder.getDirectoryHandle('images')).removeEntry(attachment.imagePath.split('/')[1]);
    const missing=await loadConversation(id);
    check(missing.messages[0].attachments[0].loadError.includes('缺失'),'missing file was silent');
    window.fixtureResult={passed:true,storage:'Chrome OPFS + IndexedDB + Web Locks',imagePath:attachment.imagePath,binaryBytes:pixels.size,jsonHasBase64:false,hydrated:true,undoPreservedPixels:true,missingFileVisible:true};
    document.querySelector('#state').textContent='通过：图片文件、路径 JSON、读回、撤销与缺图提示';
    document.querySelector('#report').textContent=JSON.stringify(window.fixtureResult,null,2);
  }catch(error){window.fixtureResult={passed:false,error:error.message};document.querySelector('#state').textContent=`失败：${error.message}`;}
};
document.documentElement.dataset.fixtureReady='true';
</script></html>
