<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent 局部截图真实 Canvas 回归</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 20px; font: 14px/1.5 system-ui,sans-serif; color: #23352e; background: #f5f8f6; }
      #cases { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
      article { padding: 12px; border: 1px solid #b8c9be; border-radius: 10px; background: white; }
      img { display: block; max-width: 100%; height: auto; margin: 10px 0; }
      pre { white-space: pre-wrap; font-size: 12px; }
      a { margin-right: 12px; }
    </style>
  </head>
  <body>
    <h1>Agent 局部截图真实 Canvas 回归</h1>
    <p id="status">等待浏览器测试</p>
    <section id="cases"></section>
    <script type="module">
      import { cropAgentVisualImage, planAgentVisualRegion, AGENT_VISUAL_LIMITS } from '../../src/sidepanel/features/agent/visual-observation.js';

      const check = (condition,message) => { if (!condition) throw new Error(message); };
      const close = (a,b,tolerance=8) => Math.abs(a-b)<=tolerance;
      const decode = source => new Promise((resolve,reject) => {
        const image=new Image();
        image.onload=()=>resolve(image); image.onerror=()=>reject(new Error('JPEG decode failed')); image.src=source;
      });
      const definitions = [
        {id:'center',viewport:{width:1000,height:700},rect:{x:390,y:280,width:28,height:24},crop:{x:244,y:192,width:320,height:200}},
        {id:'large',viewport:{width:1000,height:700},rect:{x:100,y:100,width:700,height:500},crop:{x:130,y:110,width:640,height:480}},
        {id:'edge',viewport:{width:1000,height:700},rect:{x:960,y:650,width:28,height:24},crop:{x:680,y:500,width:320,height:200}},
        {id:'tiny',viewport:{width:200,height:120},rect:{x:170,y:90,width:20,height:20},crop:{x:0,y:0,width:200,height:120}},
      ];

      window.runAgentVisualCrop = async () => {
        document.querySelector('#cases').replaceChildren();
        const dpi=devicePixelRatio;
        check(dpi===1||dpi===2,`Run this fixture with deviceScaleFactor 1 or 2, got ${dpi}`);
        const results=[];
        for(const scenario of definitions) {
          const {viewport,rect}=scenario;
          const source=document.createElement('canvas');
          source.width=viewport.width*dpi; source.height=viewport.height*dpi;
          const drawing=source.getContext('2d');
          const pixels=drawing.createImageData(source.width,source.height);
          for(let y=0;y<source.height;y++) for(let x=0;x<source.width;x++) {
            const index=(y*source.width+x)*4;
            pixels.data[index]=20+Math.round(200*x/(source.width-1));
            pixels.data[index+1]=30+Math.round(180*y/(source.height-1));
            pixels.data[index+2]=80; pixels.data[index+3]=255;
          }
          drawing.putImageData(pixels,0,0);
          // A sufficiently broad marker makes the geometry assertion stable
          // across JPEG's lossy chroma blocks; independent gradients below
          // still verify the four source-coordinate mappings.
          const marker={x:rect.x+rect.width/2-20,y:rect.y+rect.height/2-20,width:40,height:40};
          drawing.fillStyle='rgb(230,40,70)'; drawing.fillRect(marker.x*dpi,marker.y*dpi,marker.width*dpi,marker.height*dpi);
          const sourceUrl=source.toDataURL('image/png');
          const observation={viewport,elements:[{id:'e1',mainFrame:true,frameId:0,tag:'button',rect,layout:{visible:true}}]};
          const original=JSON.stringify(observation);
          const plan=planAgentVisualRegion(observation,'e1');
          check(plan.ok,`${scenario.id}: plan failed`);
          check(JSON.stringify(plan.crop)===JSON.stringify(scenario.crop),`${scenario.id}: unexpected CSS crop ${JSON.stringify(plan.crop)}`);
          check(JSON.stringify(observation)===original,`${scenario.id}: planning mutated the observation`);
          const output=await cropAgentVisualImage(sourceUrl,plan.crop,{viewport});
          check(output.sourceImage.width===source.width&&output.sourceImage.height===source.height,`${scenario.id}: wrong source pixel dimensions`);
          check(output.dataUrl.startsWith('data:image/jpeg;base64,'),`${scenario.id}: output is not JPEG`);
          const bytes=Uint8Array.from(atob(output.dataUrl.split(',')[1]),char=>char.charCodeAt(0));
          check(bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff&&bytes.at(-2)===0xff&&bytes.at(-1)===0xd9,`${scenario.id}: invalid JPEG signature`);
          check(bytes.length<=AGENT_VISUAL_LIMITS.maxBytes,`${scenario.id}: JPEG exceeds the visual budget`);
          const image=await decode(output.dataUrl);
          const factor=Math.min(1,960/Math.max(plan.crop.width*dpi,plan.crop.height*dpi));
          const expected={width:Math.round(plan.crop.width*dpi*factor),height:Math.round(plan.crop.height*dpi*factor)};
          check(image.naturalWidth===expected.width&&image.naturalHeight===expected.height,`${scenario.id}: unexpected decoded output size`);
          check(image.naturalWidth===output.image.width&&image.naturalHeight===output.image.height,`${scenario.id}: image metadata differs from decoded JPEG`);
          check(Math.max(image.naturalWidth,image.naturalHeight)<=960,`${scenario.id}: output edge exceeds 960`);
          const decoded=document.createElement('canvas'); decoded.width=image.naturalWidth; decoded.height=image.naturalHeight;
          const reader=decoded.getContext('2d',{willReadFrequently:true}); reader.drawImage(image,0,0);
          const sample=(x,y)=>Array.from(reader.getImageData(Math.floor(x),Math.floor(y),1,1).data).slice(0,3);
          const targetCenter={x:rect.x+rect.width/2,y:rect.y+rect.height/2};
          const targetPixel=sample((targetCenter.x-plan.crop.x)/plan.crop.width*decoded.width,(targetCenter.y-plan.crop.y)/plan.crop.height*decoded.height);
          check(targetPixel.every((value,index)=>close(value,[230,40,70][index],10)),`${scenario.id}: target marker did not land at its CSS crop coordinate (${targetPixel})`);
          const samples=[];
          for(const [px,py] of [[.1,.1],[.9,.1],[.1,.9],[.9,.9]]) {
            const x=Math.floor(decoded.width*px),y=Math.floor(decoded.height*py);
            const cssX=plan.crop.x+(x+.5)/decoded.width*plan.crop.width,cssY=plan.crop.y+(y+.5)/decoded.height*plan.crop.height;
            if(cssX>=marker.x-2&&cssX<=marker.x+marker.width+2&&cssY>=marker.y-2&&cssY<=marker.y+marker.height+2) continue;
            const actual=sample(x,y),expectedPixel=[20+Math.round(200*cssX/viewport.width),30+Math.round(180*cssY/viewport.height),80];
            check(actual.every((value,index)=>close(value,expectedPixel[index])),`${scenario.id}: crop maps to wrong source pixels at ${px},${py} (${actual} vs ${expectedPixel})`);
            samples.push({x,y,actual,expected:expectedPixel});
          }
          check(samples.length>=3,`${scenario.id}: too few independent geometry samples`);
          const result={id:scenario.id,dpi,viewport,sourceImage:output.sourceImage,crop:plan.crop,image:output.image,jpegBytes:bytes.length,targetPixel,samples};
          results.push(result);
          const card=document.createElement('article');
          const heading=document.createElement('h2'); heading.textContent=`${scenario.id} · ${dpi}×`;
          const preview=document.createElement('img'); preview.src=output.dataUrl; preview.alt=`${scenario.id} crop`;
          const info=document.createElement('pre'); info.textContent=JSON.stringify({source:output.sourceImage,crop:plan.crop,image:output.image,jpegBytes:bytes.length},null,2);
          const download=document.createElement('a'); download.id=`download-${scenario.id}`; download.href=output.dataUrl; download.download=`agent-visual-crop-${dpi}-${scenario.id}.jpg`; download.textContent='JPEG';
          card.append(heading,preview,info,download);
          if(scenario.id==='large') {
            const sourceDownload=document.createElement('a'); sourceDownload.id='download-source'; sourceDownload.href=sourceUrl; sourceDownload.download=`agent-visual-crop-source-${dpi}.png`; sourceDownload.textContent='Source PNG'; card.append(sourceDownload);
          }
          document.querySelector('#cases').append(card);
        }
        document.querySelector('#status').textContent=`通过 ${results.length} 个真实 Canvas/JPEG 用例，devicePixelRatio=${dpi}`;
        window.agentVisualCropResults=results;
        return {passed:true,dpi,results};
      };
      document.documentElement.dataset.fixtureReady='true';
    </script>
  </body>
</html>
