<!doctype html>
<html lang="zh-CN" data-text-preview-fixture>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>长提问与文本预览回归</title>
  <style>
    html[data-text-preview-fixture], html[data-text-preview-fixture] body { min-height: 100%; height: auto; overflow: auto; }
    #fixture { max-width: 980px; margin: auto; padding: 16px; }
    #fixture h1 { margin: 0 0 14px; font-size: 18px; }
    #fixture > p { font-size: 12px; color: var(--muted); }
    #controls { display: flex; flex-wrap: wrap; gap: 8px; }
    #controls button { padding: 7px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    #fallback { padding: 8px; width: 100%; margin-top: 16px; }
  </style>
</head>
<body>
  <main id="fixture">
    <h1>长提问全文预览</h1>
    <p>只改变显示高度，全文、复制和回退事件保留。使用真实消息渲染与预览模块。</p>
    <div id="controls"><button id="theme">切换主题</button><button id="redraw">同会话重绘</button><button id="switch">切换会话</button></div>
    <section id="messages" class="messages"></section>
    <input id="fallback" placeholder="关闭旧预览后回到这里" />
  </main>
  <script type="module">
    import '../../src/sidepanel/style.css';
    import { messageMarkup } from '../../src/sidepanel/features/messages/message-view.js';
    import { createTextPreview } from '../../src/sidepanel/features/messages/text-preview.js';

    const sentence = '请根据这份方案解释执行步骤，保留已有结论、计算假设与未核实的信息，并逐项列出下一步需要检查的内容。';
    const messages = [
      { id: 'long', role: 'user', content: `  ${sentence.repeat(16)}\r\n\n代码保持原样：\x3cscript>window.injected = true\x3c/script>\n\tconst example = "完整文本";\n最后一行必须保留。  ` },
      { id: 'responsive', role: 'user', content: '请说明每一步的输入、输出和检查方式。'.repeat(10) },
      { id: 'multiline', role: 'user', content: '一\n二\n三\n四\n五\n六\n七\n八\n九' },
      { id: 'short', role: 'user', content: '只回答一个简短问题。' },
    ];
    const original = JSON.stringify(messages);
    let conversationId = 'text-preview-a';
    const events = [], errors = [];
    const controller = createTextPreview({ document, onError: (...args) => errors.push(args), fallbackFocus: () => document.querySelector('#fallback') });
    function redraw() {
      document.querySelector('#messages').innerHTML = messages.map(message => messageMarkup(message)).join('');
      controller.sync(conversationId);
      controller.refresh();
    }
    function switchConversation() { conversationId = conversationId === 'text-preview-a' ? 'text-preview-b' : 'text-preview-a'; redraw(); }
    document.querySelector('#messages').addEventListener('click', event => {
      const action = event.target.closest('.user-action-btn');
      if (action) events.push({ action: action.dataset.action, id: action.dataset.messageId, content: messages.find(message => message.id === action.dataset.messageId)?.content });
    });
    document.querySelector('#theme').addEventListener('click', () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; });
    document.querySelector('#redraw').addEventListener('click', redraw);
    document.querySelector('#switch').addEventListener('click', switchConversation);
    window.textPreviewFixture = {
      controller, redraw, switchConversation, messages, events, errors,
      unchanged: () => JSON.stringify(messages) === original,
    };
    redraw();
    await document.fonts.ready;
    controller.refresh();
    document.documentElement.dataset.fixtureReady = 'true';
  </script>
</body>
</html>
