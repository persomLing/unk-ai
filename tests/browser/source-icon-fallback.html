<!doctype html>
<html lang="zh-CN" data-source-icon-fixture>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>来源默认图标回归</title>
    <style>
      html[data-source-icon-fixture], html[data-source-icon-fixture] body { height: auto; overflow: auto; }
      #fixture { width: min(100%, 420px); margin: 32px auto; padding: 16px; }
      #fixture > h1 { font-size: 16px; margin-bottom: 22px; }
      #result { margin-top: 16px; font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main id="fixture"><h1>来源图标</h1><section id="messages" class="messages"></section><p id="result">正在验证默认图标</p></main>
    <script type="module">
      import '../../src/sidepanel/style.css';
      import { messageMarkup, renderMessageContent } from '../../src/sidepanel/features/messages/message-view.js';
      import { createSourceIconFallback } from '../../src/sidepanel/features/messages/source-icons.js';
      import { hydrateIcons } from '../../src/sidepanel/icons.js';
      const valid = `data:image/svg+xml;base64,${btoa('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect width="16" height="16" rx="3" fill="#2563eb"/><path d="M4 8h8M8 4v8" stroke="white" stroke-width="2"/></svg>')}`;
      const invalid = 'data:image/png;base64,AAAA';
      const sources = [
        { title: '没有图标地址的来源', url: 'https://missing.fixture.test/article', readStatus: 'search-summary' },
        { title: '图标加载失败的来源', url: 'https://broken.fixture.test/article', favicon: invalid, readStatus: 'search-summary' },
        { title: '网站图标正常的来源', url: 'https://valid.fixture.test/article', favicon: valid, readStatus: 'body' },
      ];
      const fallback = createSourceIconFallback({ root: document });
      const message = { id: 'icons', role: 'assistant', content: '默认图标在来源列表和来源按钮中保持一致。', sources };
      const root = document.querySelector('#messages');
      function render() {
        root.innerHTML = messageMarkup(message);
        renderMessageContent(root.querySelector('[data-message-content]'), message.content);
        hydrateIcons(root);
      }
      render();
      root.addEventListener('click', event => {
        const pill = event.target.closest('.sources-pill');
        if (!pill) return;
        const popover = pill.parentElement.querySelector('.sources-popover');
        popover.hidden = !popover.hidden;
        pill.setAttribute('aria-expanded', String(!popover.hidden));
      });
      window.sourceIconFixture = { valid, invalid, render, fallback };
      document.documentElement.dataset.fixtureReady = 'true';
    </script>
  </body>
</html>
