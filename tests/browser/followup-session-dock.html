<!doctype html>
<html lang="zh-CN" data-followup-session-fixture>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>连续追问与右侧收起回归</title>
    <style>
      html[data-followup-session-fixture], html[data-followup-session-fixture] body { height: auto; min-height: 100%; overflow: auto; }
      #fixture { box-sizing: border-box; width: min(100%, 840px); margin: auto; padding: 16px; }
      #fixture h1 { margin: 0 0 8px; font-size: 18px; }
      #fixture > p, #fixture label { font-size: 12px; line-height: 1.6; }
      #result { color: var(--muted); overflow-wrap: anywhere; }
      #main-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      #main-controls button { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); color: var(--ink); }
      #main-input { box-sizing: border-box; width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
    </style>
  </head>
  <body>
    <main id="fixture">
      <h1>连续追问与右侧收起</h1>
      <p>真实选区捕获、追问会话管理器、浮窗、应用内核与模型网关；模型响应和保存使用隔离内存替身，不访问外部服务。回答后的来源列表只用于本地弹层交互检查。</p>
      <p id="result" role="status">等待夹具就绪</p>
      <nav id="main-controls" aria-label="模拟主对话导航">
        <button id="switch-a" type="button">打开主对话 A</button>
        <button id="switch-b" type="button">打开主对话 B</button>
        <button id="new-main" type="button">新建主对话</button>
      </nav>
      <section id="main-messages" class="messages" aria-label="主对话消息"></section>
      <label for="main-input">主对话输入框</label>
      <textarea id="main-input" placeholder="主对话草稿"></textarea>
    </main>
    <script type="module">
      import '../../src/sidepanel/style.css';
      import '../../src/sidepanel/features/messages/selection-chat.css';
      import { messageMarkup, renderMessageContent } from '../../src/sidepanel/features/messages/message-view.js';
      import { captureArticleSelection } from '../../src/sidepanel/features/messages/article-selection.js';
      import { createArticleSelectionMenu } from '../../src/sidepanel/features/messages/article-selection-menu.js';
      import { createSelectionChatRuntime } from '../../src/sidepanel/features/messages/selection-chat-runtime.js';
      import { createSelectionChatView } from '../../src/sidepanel/features/messages/selection-chat-view.js';
      import { createSelectionChatSessions } from '../../src/sidepanel/features/messages/selection-chat-sessions.js';
      import { createModelGateway } from '../../src/app/model-gateway.js';
      import { hydrateIcons } from '../../src/sidepanel/icons.js';

      const copy = value => value == null ? null : structuredClone(value);
      const timestamp = '2026-11-11T04:00:00.000Z';
      const answerText = '## 原文与语境\n\n在向量库和 RAG 中，metadata 是每个 chunk 附带的键值对，存储时不参与向量化。它能用于过滤和回溯来源，通常与文本、向量一起保存。\n\nembedding 是文本的向量表示，用于衡量文本的语义相似度。metadata 中的 tenant_id、source 和 page 可以保留过滤条件及出处。\n\n## 附近正文\n\n前置过滤缩小检索范围；来源字段帮助核对原文。两个概念需要联系本轮原问题理解。';
      const mainConversation = id => ({ version: 2, id, storage: 'local', groupId: 'main-group',
        title: id === 'source-a' ? '主对话 A：RAG 的概念' : '主对话 B：检索流程', createdAt: timestamp, updatedAt: timestamp,
        pageContext: { title: '无关网页', text: 'UNRELATED_CURRENT_PAGE', url: 'https://unrelated.fixture.invalid/' },
        messages: [{ id: `${id}-question`, role: 'user', content: 'metadata 与 embedding 在 RAG 中如何配合？',
          displayContent: 'metadata 与 embedding 在 RAG 中如何配合？', createdAt: timestamp },
        { id: `${id}-answer`, role: 'assistant', content: answerText, status: 'complete', createdAt: timestamp,
          reasoning: 'PRIVATE_REASONING_MUST_NOT_BECOME_REFERENCE' }] });
      const mains = new Map(['source-a', 'source-b'].map(id => [id, mainConversation(id)]));
      let currentConversation = copy(mains.get('source-a'));
      let currentChat = null;
      let idSequence = 0;
      let newSequence = 0;
      let answerSequence = 0;
      let nextAnswerMode = 'complete';
      let menu = null;
      const records = new Map([...mains].map(([id, value]) => [id, copy(value)]));
      const originalMainRecords = JSON.stringify([...records.values()]);
      const chats = [], requests = [], writes = [], errors = [], opens = [], trackingChanges = [], outsideEscapes = [], pendingAnswers = [];
      const messages = document.querySelector('#main-messages');
      const mainInput = document.querySelector('#main-input');
      const result = document.querySelector('#result');
      const profile = { id: 'followup-fixture-model', model: 'followup-fixture-model', endpointUrl: 'https://followup-model.fixture.invalid/v1',
        apiKey: 'local-fixture-key', contextLength: 20000, maxTokens: 800, supportsVision: false,
        reasoningEffort: 'low', webSearchEnabled: false, webFetchEnabled: false };
      const gateway = createModelGateway({ transport: async input => {
        requests.push({ purpose: input.purpose, request: copy(input.request), model: input.profile.model });
        if (input.purpose === 'suggestions') return '[]';
        if (input.purpose !== 'answer') throw new Error(`Unexpected local fixture request: ${input.purpose}`);
        const index = ++answerSequence;
        const partial = `第 ${index} 轮追问：正在结合原文解释。`;
        const full = `${partial}\n\nmetadata 保存键值字段，embedding 保存语义向量；后续追问仍可参考这个分支的已有回答。`;
        const mode = nextAnswerMode;
        nextAnswerMode = 'complete';
        if (mode === 'thinking') input.onReasoning('正在核对选区的语义和原提问。', '正在核对选区的语义和原提问。');
        else input.onDelta(partial, partial);
        if (mode === 'hold' || mode === 'thinking') return await new Promise((resolve, reject) => pendingAnswers.push({
          index, input, partial, full, resolve, reject, phase: mode === 'thinking' ? 'thinking' : 'answering', released: false }));
        await new Promise(resolve => setTimeout(resolve, 40));
        input.onDelta(full.slice(partial.length), full);
        return full;
      } });

      function renderMain() {
        menu?.hide();
        messages.innerHTML = currentConversation.messages.map(message => messageMarkup(message)).join('');
        for (const message of currentConversation.messages) {
          if (message.role !== 'assistant') continue;
          renderMessageContent(messages.querySelector(`[data-message-id="${message.id}"] [data-message-content]`), message.content);
        }
        hydrateIcons(messages);
      }
      function createChat(selection, anchorRect) {
        let chat;
        let tracking = true;
        const runtime = createSelectionChatRuntime({ selection,
          getConfig: () => ({ endpointUrl: profile.endpointUrl, models: [{ id: profile.id }] }), getProfile: () => profile,
          modelGateway: gateway, makeId: () => `followup-branch-${++idSequence}`,
          writeConversation: async conversation => {
            writes.push(copy(conversation));
            const saved = { ...copy(conversation), syncStatus: 'pending', syncDirectoryName: 'fixture-directory' };
            records.set(saved.id, saved);
            return saved;
          }, loadConversation: async id => copy(records.get(id)), onError: error => errors.push(error?.message || String(error)) });
        runtime.subscribe(event => {
          if (event.type !== 'reply-ended') return;
          // Known local presentation data; no source request is made by this fixture.
          const answer = runtime.state.conversation.messages.find(message => message.id === event.assistantId);
          if (answer) answer.sources = [{ title: '本地 RAG 说明', url: `${location.origin}/tests/browser/followup-session-dock.html#source`,
            domain: '本地夹具', readStatus: 'body' }];
        });
        const view = createSelectionChatView({ document, runtime, selection, anchorRect, fallbackFocus: () => mainInput,
          onClose: () => { sessions.forget(chat); },
          onReplace: async (ownedRuntime, scope) => {
            const candidate = await ownedRuntime.takeConversation(scope);
            if (!scope.isCurrent()) return false;
            currentConversation = candidate;
            sessions.syncConversation(currentConversation.id);
            renderMain();
            return true;
          } });
        chat = Object.freeze({ ...view, runtime, sourceId: selection.conversationId,
          setTracking(value, reason) {
            tracking = Boolean(value);
            trackingChanges.push({ conversationId: view.conversationId, tracking, reason });
            return view.setTracking(value, reason);
          }, get tracking() { return tracking; } });
        chats.push(chat);
        return chat;
      }
      const sessions = createSelectionChatSessions({ getConversationId: () => currentConversation.id, createChat });
      function openReference(selection, anchorRect = { left: 12, top: 90, right: 12, bottom: 90, width: 0, height: 0 }) {
        const opened = sessions.open(selection, anchorRect);
        opens.push({ accepted: opened.accepted, reused: opened.reused, reason: opened.reason || '',
          conversationId: opened.chat?.conversationId || null, sourceId: selection.conversationId });
        if (opened.chat) currentChat = opened.chat;
        return { accepted: opened.accepted, reused: opened.reused, reason: opened.reason || '', conversationId: opened.chat?.conversationId || null };
      }
      function switchMain(id) {
        currentConversation = copy(mains.get(id));
        sessions.syncConversation(currentConversation.id);
        renderMain();
      }
      function newMain() {
        currentConversation = { version: 2, id: `new-main-${++newSequence}`, title: '新对话', createdAt: timestamp, updatedAt: timestamp, messages: [] };
        sessions.syncConversation(currentConversation.id);
        renderMain();
      }
      document.querySelector('#switch-a').addEventListener('click', () => switchMain('source-a'));
      document.querySelector('#switch-b').addEventListener('click', () => switchMain('source-b'));
      document.querySelector('#new-main').addEventListener('click', newMain);
      menu = createArticleSelectionMenu({ document, root: messages, getConversation: () => currentConversation,
        onAsk: openReference, onQuote: () => {}, onError: error => errors.push(error?.message || String(error)) });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') outsideEscapes.push(event.key); });

      function captureText(text) {
        const body = messages.querySelector('.assistant-message [data-message-content]');
        if (!body) throw new Error('Select an existing main answer first.');
        const full = body.textContent;
        const offset = full.indexOf(text);
        if (offset < 0) throw new Error('Exact fixture selection was not found.');
        const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
        const nodes = []; let node;
        while ((node = walker.nextNode())) nodes.push(node);
        const boundary = target => {
          let previous = 0;
          for (const item of nodes) {
            if (target <= previous + item.textContent.length) return [item, target - previous];
            previous += item.textContent.length;
          }
          throw new Error('Range boundary was not found.');
        };
        const range = document.createRange();
        range.setStart(...boundary(offset));
        range.setEnd(...boundary(offset + text.length));
        const nativeSelection = window.getSelection();
        nativeSelection.removeAllRanges(); nativeSelection.addRange(range);
        const captured = captureArticleSelection({ selection: nativeSelection, root: messages, conversation: currentConversation });
        if (!captured) throw new Error('The real article selection capture rejected the reference.');
        return copy(captured);
      }
      function openText(text) {
        const captured = captureText(text);
        menu.hide();
        window.getSelection().removeAllRanges();
        return openReference(captured.selection);
      }
      function advanceAnswers() {
        for (const pending of pendingAnswers) {
          if (pending.released || pending.phase !== 'thinking') continue;
          pending.phase = 'answering';
          pending.input.onDelta(pending.partial, pending.partial);
        }
      }
      function releaseAnswers({ late = false, fail = false } = {}) {
        for (const pending of pendingAnswers) {
          if (pending.released) continue;
          pending.released = true;
          if (fail) { pending.reject(new Error('本地回归模拟：模型连接中断。')); continue; }
          const content = `${pending.full}${late ? '\nLATE_CALLBACK_MUST_BE_IGNORED' : ''}`;
          pending.input.onDelta(pending.phase === 'thinking' ? content : content.slice(pending.partial.length), content);
          pending.resolve(content);
        }
      }
      // Override only this isolated document's read-only projection so the
      // real presenter receives deterministic visibilitychange events.
      function setVisibility(value) {
        if (value == null) delete document.visibilityState;
        else if (value === 'visible' || value === 'hidden') {
          Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => value });
        } else throw new TypeError('Fixture visibility must be visible, hidden, or null.');
        document.dispatchEvent(new Event('visibilitychange'));
      }
      const rectFor = node => {
        if (!node || node.hidden || !node.isConnected) return null;
        const rect = node.getBoundingClientRect();
        return { left: rect.left, top: rect.top, width: rect.width, height: rect.height, right: rect.right, bottom: rect.bottom };
      };
      function snapshot() {
        return { mainId: currentConversation.id, chats: chats.map(chat => ({ id: chat.conversationId, sourceId: chat.sourceId,
          tracking: chat.tracking, closed: !chat.element.isConnected, docked: chat.isDocked(), dockState: chat.element.dataset.dockState,
          busy: chat.runtime.isBusy(), pendingSelection: chat.runtime.getSelection(), conversation: copy(chat.runtime.state.conversation),
          rect: rectFor(chat.element), launcher: rectFor(chat.launcher), launcherTitle: chat.launcher?.title || '',
          launcherBusy: chat.launcher.dataset.busy, launcherActivity: chat.launcher.dataset.activity,
          launcherUnread: chat.launcher.dataset.unread,
          styleRect: { left: parseFloat(chat.element.style.left), top: parseFloat(chat.element.style.top),
            width: parseFloat(chat.element.style.width), height: parseFloat(chat.element.style.height) },
          draft: chat.element.querySelector('textarea')?.value || '',
          trackingText: chat.element.textContent,
          animations: [...chat.element.getAnimations(), ...chat.launcher.getAnimations()].map(animation => ({ playState: animation.playState,
            duration: animation.effect?.getTiming().duration || 0 })) })), currentChatId: currentChat?.conversationId || null,
          answers: copy(requests.filter(request => request.purpose === 'answer')), writes: copy(writes), records: [...records.values()].map(copy),
          originalMainsUnchanged: JSON.stringify([...records.values()].filter(value => mains.has(value.id))) === originalMainRecords,
          opens: copy(opens), trackingChanges: copy(trackingChanges), errors: [...errors],
          pendingAnswers: pendingAnswers.filter(answer => !answer.released).length, outsideEscapes: outsideEscapes.length,
          visibleLaunchers: [...document.querySelectorAll('.selection-chat-launcher')].filter(node => !node.hidden).length };
      }
      function stressCompact(id) {
        const chat = chats.find(chat => chat.conversationId === id);
        if (!chat || chat.isDocked()) throw new Error('Expand a live fixture chat before compact stress.');
        chat.element.style.left = '10px'; chat.element.style.top = '10px';
        chat.element.style.width = '280px'; chat.element.style.height = '260px';
        chat.element.querySelector('blockquote').textContent = '长段落引用及它的上下文。'.repeat(600);
        chat.element.querySelector('textarea').style.height = '120px';
        const feedback = chat.element.querySelector('.selection-chat-feedback');
        feedback.hidden = false;
        feedback.textContent = '保存状态需要重新核对，请保留窗口。'.repeat(25);
        chat.setTracking(false, '已切换主对话；新的选区将另开追问。');
        chat.sync();
      }
      function stressHeaderLayout(id, { collapsed = true, width = 420, height = 580 } = {}) {
        const chat = chats.find(chat => chat.conversationId === id);
        if (!chat || chat.isDocked()) throw new Error('Expand a live fixture chat before header stress.');
        chat.element.style.left = '10px'; chat.element.style.top = '10px';
        chat.element.style.width = `${width}px`; chat.element.style.height = `${height}px`;
        const reference = chat.element.querySelector('.selection-chat-reference');
        reference.open = !collapsed;
        reference.querySelector('blockquote').textContent = '这段原文有很多内容，需要在引用区域内单独滚动查看。'.repeat(300);
        chat.element.querySelector('.selection-chat-scope').textContent = '本主对话的后续选区会继续加入这段未分组追问。关闭窗口后，下次将创建新的追问对话。';
        const body = chat.element.querySelector('.selection-chat-messages');
        body.replaceChildren(...Array.from({ length: 16 }, (_, index) => {
          const row = document.createElement('article');
          row.className = 'message assistant-message';
          const content = document.createElement('div');
          content.className = 'message-content';
          content.textContent = `第 ${index + 1} 段历史回答：正文必须留在消息区内滚动，不能把选区提示或引用摘要挤掉。`.repeat(12);
          row.append(content);
          return row;
        }));
      }
      window.followupSessionFixture = { captureText, openText, openReference, switchMain, newMain, snapshot, releaseAnswers, advanceAnswers, setVisibility, stressCompact, stressHeaderLayout,
        holdNextAnswer: ({ thinking = false } = {}) => { nextAnswerMode = thinking ? 'thinking' : 'hold'; },
        chat: id => chats.find(chat => chat.conversationId === id),
        flushAll: async () => { await Promise.all(chats.map(chat => chat.runtime.flush())); },
        dispose: () => { chats.forEach(chat => chat.close({ restoreFocus: false })); sessions.dispose(); menu.dispose(); } };
      window.addEventListener('pagehide', () => window.followupSessionFixture.dispose(), { once: true });
      renderMain();
      await document.fonts.ready;
      document.documentElement.dataset.fixtureReady = 'true';
      result.textContent = '就绪：可验证同对话复用、切换解除跟随、右侧动画收起与恢复。';
    </script>
  </body>
</html>
