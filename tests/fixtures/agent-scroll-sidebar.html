<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>第1章 · 页面操作验收</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #263238; background: #f6f7f9; }
  header { height: 64px; padding: 16px 28px; border-bottom: 1px solid #ddd; background: white; }
  nav { position: fixed; top: 90px; left: 24px; width: 250px; height: 360px; overflow-y: auto; scroll-behavior: smooth; background: white; border: 1px solid #bbb; border-radius: 8px; }
  nav a { display: block; padding: 10px 16px; min-height: 44px; color: #34495e; text-decoration: none; border-bottom: 1px solid #eee; }
  nav a[aria-current] { background: #def0ff; font-weight: 600; }
  main { margin: 24px 24px 24px 310px; padding: 28px; max-width: 750px; min-height: 520px; background: white; border-radius: 8px; }
  button { padding: 8px 12px; border: 1px solid #aaa; border-radius: 6px; background: white; }
</style>
<header>独立目录滚动验收 · <span id="clock"></span></header>
<nav aria-label="教程目录"></nav>
<main>
  <h1>第1章 教程导读</h1>
  <p id="article">本页只包含教程概述，其中提到 MCP。真正的 MCP 章节是左侧目录的第20章。</p>
  <button aria-expanded="true" aria-controls="details">基础篇已展开</button>
  <p id="details">验收：只滚动左侧目录，找到第20章并读取正文；页眉时钟变化不能算滚动成功。</p>
</main>
<script>
  const nav = document.querySelector('nav');
  for (let chapter = 1; chapter <= 100; chapter += 1) {
    const link = document.createElement('a');
    link.href = '#/chapter' + chapter;
    link.textContent = '第' + chapter + '章 ' + (chapter === 20 ? 'MCP 模型上下文协议' : '教程内容');
    nav.append(link);
  }
  function render() {
    const chapter = Number(location.hash.match(/chapter(\d+)/)?.[1]) || 1;
    const heading = '第' + chapter + '章 ' + (chapter === 20 ? 'MCP 模型上下文协议' : '教程导读');
    document.querySelector('h1').textContent = heading;
    document.title = heading + ' · 页面操作验收';
    document.querySelector('#article').textContent = chapter === 20
      ? '本章正文：MCP（模型上下文协议）用统一方式连接 AI 应用与外部工具及数据源。客户端发现服务器提供的工具、资源和提示，按授权范围发起请求。工具的存在不等于操作已成功，应根据实际返回结果核对。'
      : '本页只包含教程概述，其中提到 MCP。真正的 MCP 章节是左侧目录的第20章。';
    for (const link of nav.children) {
      if (link.hash === '#/chapter' + chapter) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    }
  }
  render();
  addEventListener('hashchange', render);
  setInterval(() => document.querySelector('#clock').textContent = new Date().toLocaleTimeString(), 1000);
</script>
</html>
